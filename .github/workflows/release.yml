name: 打包发布

# 推一个 v* 的 tag 就自动跑；也可以在 Actions 页面手动触发（填个版本号）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（形如 v1.0.0）'
        required: true
        default: 'v0.0.0-manual'

# softprops/action-gh-release 需要写权限才能建 Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成 Release 说明要读「上一个 tag..本 tag」的提交，浅克隆拿不到历史 tag
          fetch-depth: 0

      - name: 安装 .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.version }}' }
          if (-not $tag) { $tag = 'v0.0.0' }
          $number = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag = $tag  ->  assembly version = $number"

      # 自检跑的是本地 HttpListener 上的假 HLS 服务器，不依赖外网，所以 CI 里也能跑。
      # 它守着下载引擎、任务队列、续传、站点适配器这些回归，先过这一关再打包。
      - name: 自检（不依赖外网）
        run: dotnet run --project tests/M3U8Downloader.SelfTest -c Release

      # 复用本地同一个脚本：CI 与本地走同一条发布路径，避免打出来的包不一样。
      # -Version 让 exe 里的版本号与 tag 一致。
      - name: 发布自包含包
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -Version ${{ steps.ver.outputs.number }}

      - name: 压缩成 zip
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 用 /* 打包：解压出来直接就是 exe，不再套一层目录
          Compress-Archive -Path 'publish/app-win-x64/*' -DestinationPath "dist/M3U8Downloader-$tag-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path 'publish/cli-win-x64/*' -DestinationPath "dist/m3u8dl-$tag-win-x64.zip" -CompressionLevel Optimal

          Get-ChildItem dist | ForEach-Object {
            Write-Host ("  {0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 1))
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.ver.outputs.tag }}
          path: dist/*.zip
          retention-days: 30

      # 把「这次到底解决了什么问题」写进 Release 页面 —— 用户点进来第一眼要看的
      # 就是这个，而不是安装说明。内容直接从提交标题生成，所以提交标题要写成人话。
      - name: 整理更新说明
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'

          # 上一个 tag；万一没有（首次发版）就退回到仓库的第一个提交
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD | Select-Object -Last 1 }
          Write-Host "比对范围：$prev..$tag"

          # 只取提交标题，并按时间正序（git log 默认倒序）
          # 「版本号 x.y.z」这类提交没有信息量，跳过
          $items = @(git log "$prev..$tag" --no-merges --pretty=format:"%s" --reverse |
                     Where-Object { $_ -and $_.Trim() -and $_ -notmatch '^版本号\s' })

          $changes = if ($items.Count -gt 0) {
            ($items | ForEach-Object { "- $_" }) -join "`n"
          } else {
            '（本次以内部调整为主，没有面向用户的功能或修复）'
          }

          $repoUrl = "https://github.com/${{ github.repository }}"
          $lines = @(
            '解压后双击 `M3U8Downloader.exe`，免安装（已自带 .NET 与 Windows App SDK 运行时）。'
            ''
            '| 包 | 用途 |'
            '|---|---|'
            '| `M3U8Downloader-*-win-x64.zip` | 图形界面（主程序） |'
            '| `m3u8dl-*-win-x64.zip` | 命令行版 |'
            ''
            '## 本次解决的问题'
            ''
            $changes
            ''
            '## 使用提示'
            ''
            '- **系统要求**：Windows 10 1809+ / Windows 11，64 位'
            '- **不含 FFmpeg**：不配置也能正常下载，只是产物保留 `.ts` 不转 MP4；需要转 MP4 时在「设置 → FFmpeg」一键下载'
            '- **首次运行**：程序无代码签名，若被 SmartScreen 拦住，点「更多信息」→「仍要运行」'
            ''
            "**完整改动**：$repoUrl/compare/$prev...$tag"
          )

          $lines | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host '----- release-notes.md -----'
          Get-Content release-notes.md

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: M3U8 视频下载器 ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          # 说明由上一步生成；不用 generate_release_notes（它只认 PR，
          # 而本仓库是直接往 master 提交的，生成出来是空的）
          body_path: release-notes.md
